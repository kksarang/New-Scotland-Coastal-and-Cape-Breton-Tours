name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set the GA_MEASUREMENT_ID repository variable (G-XXXXXXX) to enable Google Analytics.
          VITE_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # Public Formspree form ID (e.g. xyzabcde) — set FORMSPREE_FORM_ID in repository variables.
          VITE_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
